# HG-H0 摩擦 — 掃引の設定（run.py が読む）
seed: 20260929
steps_per_cycle: 32            # 収束確認: 24 / 32 / 48 / 96 刻みで前進の差 < 0.4%（2026-09-29）
points_per_segment: 4          # 4 と 8 で前進の差 < 0.1%
workers: 12

# S1: 比の掃引（準静的クーロン摩擦では、全方向の μ を同じ倍率にしても動きは変わらない = 比だけで決まる。
#     トルクと仕事は μ_forward に比例する。2026-09-29 に数値で確認）
ratio_sweep:
  ratios: {log_min: 1.0, log_max: 80.0, n: 28}     # 1〜80（受動輪の比まで含める）
  amplitude_deg: [20, 30, 40]
  waves: [0.75, 1.0, 1.25, 1.5]

# S2: 感度（比 = ratio_ref の周り）
sensitivity:
  ratio_ref: [2.0, 4.0]
  lr_asym: [0.0, 0.05, 0.1, 0.2, 0.3]
  fb_ratio: [0.5, 0.8, 1.0, 1.5, 3.0]
  point_sigma: [0.0, 0.05, 0.15, 0.25]
  point_sigma_seeds: 12

# S3: 床ごとの Monte Carlo
monte_carlo:
  samples_per_floor: 160
  amplitude_deg: [30, 40]
  waves: [0.75, 1.0, 1.25]
