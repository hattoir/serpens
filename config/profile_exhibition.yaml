# EXHIBITION profile（robot.yaml への上書き。`load_config(overlay="config/profile_exhibition.yaml")`）。
# 60〜90 秒の体験弧 NOTICE → LOOK → HESITATE → TRACK → APPROACH → OBSERVE → ENGAGE → RELAX → LEAVE/REST が
# **起きやすい**設定。固定スクリプトではなく、Utility / 内部状態 / grammar の係数だけを変える。
# 決定的瞬間: 来場者が横へ動く → 気づく（一次反応 150〜300ms）→ 視線を向ける → 少し観察 → 少し迷う → 自分から近づく。
# Fear 監査（docs/exhibition_profile.md）: 人に向けた威嚇的な動き（S 字・フル鎌首・速い首振り・急加速・直進突撃）は使わない。
behavior:
  internal:
    # 気づいた瞬間に好奇心が振り切れると（novelty 0.60）すぐ近づく。展示では、まず見て（OBSERVE）、落ち着いて見ている間に
    # 好奇心が育って（calm）から自分から近づく。OBSERVE は (1 − 0.5c)、APPROACH は c に比例するので、c が育つことが「迷い → 決心」になる
    curiosity: {baseline: 0.40, rise_tau_s: 20.0, decay_tau_s: 20.0, saturation: 1.0,
                gains: {novelty: 0.08, alone: 0.015, proximity: -0.02, calm: 0.03}}
  utility:
    # LOOK（ALERT）を少し長く、TRACK（OBSERVE）を最低 4 秒。ためらいは novelty 由来（utility.approach_novelty_hesitation）
    min_dwell_overrides: {PETTED: 2.0, ALERT: 2.5, OBSERVE: 4.0, COIL_REST_MOOD: 20.0, COIL_REST_HEAT: 60.0, SLEEP: 8.0}
    approach_novelty_hesitation: 0.9
    # TRACK（OBSERVE）を ALERT 直後に勝たせる（novelty が抜けると APPROACH が 1.15 倍を超えて自分から近づく）
    weights: {SLEEP: 0.9, PATROL: 1.0, ALERT: 1.4, OBSERVE: 1.3, APPROACH: 1.7, ENGAGE: 1.3, PETTED: 3.0, RETREAT: 1.8,
              COIL_REST_MOOD: 1.1, COIL_REST_HEAT: 0.0}
  expression:
    look_duration_s: 0.8          # 頭の向き直しをゆっくり（速い首振りは威嚇に見える）
    alert_neck_deg: 55.0          # 「見上げる」の下限（neck.look_min_deg）。高く持ち上げない
    engage_neck_deg: 58.0
  grammar:
    ENGAGE:                       # RELAX: かかわって 10〜16 秒で力を抜き、頭を少し下げる（威嚇の逆）
      on_enter:
        - {do: sag, at: [10.0, 16.0], torque_ratio: 0.7, release_s: 8.0}
      while:
        - {do: flick, rate_per_min: novelty}
        - {do: tilt, every: [5.0, 10.0]}
        - {do: glance_away, every: [4.0, 8.0]}
  controller:
    speed_approach_mm_s: 40.0     # 忍び寄り（stalk）をさらにゆっくり
