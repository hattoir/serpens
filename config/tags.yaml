# AprilTag の地図（座標系 home。決定 Q11: 原点 = ドックのタグ中心、x = 部屋の方向、y = 左、z = 上、m / rad、yaw は反時計回り）
# **すべて DESIGN 値（部屋はまだ測っていない）。** タグを貼ったら実測してここを更新し、map_version を上げる。
# yaw_rad はタグの面が向いている方向（壁から部屋の内側へ）。z_m はタグ中心の床からの高さ（幅木の高さ。頭カメラが水平で見える高さ）。
frame_id: home
map_version: tags-v0
family: tag36h11
tag_size_m: 0.06              # 黒枠の外寸。印刷したら実測
tags:
  - {id: 0, x_m: 0.0, y_m: 0.0,   z_m: 0.05, yaw_rad: 0.0,    note: "ドック（原点）。部屋の +x を向く"}
  - {id: 1, x_m: 3.0, y_m: 0.5,   z_m: 0.05, yaw_rad: 3.1416, note: "奥の壁。-x を向く"}
  - {id: 2, x_m: 1.5, y_m: 1.25,  z_m: 0.05, yaw_rad: -1.5708, note: "左の壁。-y を向く"}
  - {id: 3, x_m: 1.5, y_m: -1.25, z_m: 0.05, yaw_rad: 1.5708,  note: "右の壁。+y を向く"}
