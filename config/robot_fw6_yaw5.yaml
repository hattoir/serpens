# Floor Watch 6 モーター案 A: 胴体 yaw ×5 ＋ 首 pitch ×1。**CONCEPT。CAD に存在しない。**
# FW03（robot_fw5.yaml）の尾側に 95mm の節を 1 つ足しただけ（ユーザーの「大きめの Body」方針に沿う仮置き）。
# 追加節の中身・電池位置・配線は未設計。質量はすべて ASSUMPTION。
body:
  length_mm: 668
  diameter_mm: 92
  mass_g: 1000
  tail_x_mm: 0
  head_tip_x_mm: 668
joints:
  - {name: J6, servo_id: 6, axis: yaw,   x_mm: 145.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J5, servo_id: 5, axis: yaw,   x_mm: 240.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J4, servo_id: 4, axis: yaw,   x_mm: 335.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J3, servo_id: 3, axis: yaw,   x_mm: 430.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J2, servo_id: 2, axis: yaw,   x_mm: 525.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J1, servo_id: 1, axis: pitch, x_mm: 611.8, direction: 1, horn_offset_deg: 0.0, onset_deg: null, onset_collides_deg: null, mechanical_min_deg: 0.0, mechanical_max_deg: 45.0, min_deg: 0.0, max_deg: 40.0, max_speed_dps: 120.0}
mass_budget_g:
  servo_each: 55
  servo_count: 6
  segment_frame_each: 45
  segment_frame_count: 7
  passive_wheels_total: 0
  head_total: 90
  skin_and_wiring: 115
  tail_payload: 130
  neck_lifted_mass: 90
  neck_lifted_cog_mm: 35
poses:
  home: {J1: 0, J2: 0, J3: 0, J4: 0, J5: 0, J6: 0}
gait:
  presets:
    # 胴体ヨー 5 本で 1 波 = Ω 72°
    forward:    {amplitude_deg: 30.0, spatial_freq_deg: 72.0, temporal_freq_hz: 0.5, turn_bias_deg: 0.0}
    turn_left:  {amplitude_deg: 30.0, spatial_freq_deg: 72.0, temporal_freq_hz: 0.5, turn_bias_deg: 20.0}
sim:
  # 近似カプセル（径 92mm、節 95mm）が中立でも重なるため自己接触を切る（MuJoCo のモデル化の都合。実外装の干渉判定は CAD で行う）
  mujoco_self_collision: false
