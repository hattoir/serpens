# Serpens EX-1 設定ファイル
# 寸法・しきい値・ゲインはすべてここに書く。コードに数値を直書きしない。
# 単位はキー名の接尾辞で示す: _mm, _deg, _s, _hz, _c(℃), _v, _g, _dps(°/s), _dps2(°/s²)
# 「仮」と書いた値は未確定。実機を見て必ず見直すこと。

# ---------------------------------------------------------------------------
# 機体寸法（確定値）
# 原点 = 尾端、+x が頭方向、単位 mm
# ---------------------------------------------------------------------------
body:
  length_mm: 850
  diameter_mm: 50
  mass_g: 1000
  tail_x_mm: 0
  head_tip_x_mm: 850

# 関節。x_mm は尾端からの位置。axis は yaw(水平) / pitch(持ち上げ) / roll(かしげ)。
#   servo_id        バス上の ID
#   direction       取り付け向き（+1 / -1）
#   horn_offset_deg サーボホーン取付角のずれ（実機で測って吸収する。既定 0）
#   max_speed_dps   その軸の最高角速度（頭部は丁寧に動かすため遅い）
#
# **可動域は意味の違う3つを別々に持つ**（joint_limit_policy に状態と出典）。
#   onset_deg / onset_collides_deg
#       geometry_collision_onset。CAD nominal geometry で干渉が始まる境界の bracket。
#       **指令のクランプ値として使わない。** 64.8° は干渉なし、64.9° で干渉（R03 検査姿勢）
#   mechanical_min/max_deg
#       mechanical_design_limit。**PROVISIONAL**（ケーブル経路が不合格のため確定していない）
#   min_deg / max_deg
#       software_operational_limit。**CONDITIONAL**。指令はここでクランプする。
#       物理試験へ進むための候補値であって、実機で許可された値ではない
#
# 実機の 9軸構成（コードから確認。2026-09-16）: 胴体ヨー J1〜J6 / 首ピッチ J7 / 頭ヨー J8 / 頭ロール J9。
# **胴体に pitch 軸は無い**（垂直波＝螺旋歩容を作れない）
# TODO: 外皮ニット装着後に可動範囲を再測定する（README 参照）
joints:
  - {name: J1, servo_id: 1, axis: yaw,   x_mm: 100, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J2, servo_id: 2, axis: yaw,   x_mm: 195, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J3, servo_id: 3, axis: yaw,   x_mm: 290, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J4, servo_id: 4, axis: yaw,   x_mm: 385, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J5, servo_id: 5, axis: yaw,   x_mm: 480, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J6, servo_id: 6, axis: yaw,   x_mm: 575, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J7, servo_id: 7, axis: pitch, x_mm: 670, direction: 1, horn_offset_deg: 0.0, onset_deg: null, onset_collides_deg: null, mechanical_min_deg: -10.0, mechanical_max_deg: 95.0, min_deg: -8.0,  max_deg: 90.0, max_speed_dps: 120.0}
  - {name: J8, servo_id: 8, axis: yaw,   x_mm: 725, direction: 1, horn_offset_deg: 0.0, onset_deg: null, onset_collides_deg: null, mechanical_min_deg: -85.0, mechanical_max_deg: 85.0, min_deg: -80.0, max_deg: 80.0, max_speed_dps: 90.0}
  - {name: J9, servo_id: 9, axis: roll,  x_mm: 765, direction: 1, horn_offset_deg: 0.0, onset_deg: null, onset_collides_deg: null, mechanical_min_deg: -40.0, mechanical_max_deg: 40.0, min_deg: -35.0, max_deg: 35.0, max_speed_dps: 90.0}

# ---------------------------------------------------------------------------
# 可動域の状態と出典（CAD 側の最新提案。2026-09-16）
# **どれも実機で確かめていない。** software_operational_limit は「物理試験へ進むための候補」
# ---------------------------------------------------------------------------
joint_limit_policy:
  cad_sources: [Serpens_BELLY_R03_TWO_LINK_REVIEW, Serpens_R03_COUPON_CABLE_PREP]
  status:
    geometry_collision_onset: CAD_VERIFIED    # nominal geometry のみ。実物・ケーブル込みではない
    mechanical_design_limit: PROVISIONAL      # ±55°（暫定）
    software_operational_limit: CONDITIONAL   # ±50°（条件つき候補）
  verified_in_cad: true
  verified_with_cable: false                  # Cable Routing が不合格
  verified_with_hardware: false               # 実機ゼロ
  onset_bracket_deg: [64.8, 64.9]             # この間で干渉が始まる（64.8 なし / 64.9 あり）
  # **clamp に使ってよいのは software_operational_limit だけ。**
  clamp_source: software_operational_limit

# 首（J7）の使い分け
neck:
  look_min_deg: 55.0        # 人を見るときの J7 下限
  look_max_deg: 65.0        # 人を見るときの J7 上限（これ以上倒すと J8 が世界座標で roll になる）
  full_rear_min_deg: 85.0   # 「真上から見下ろすフル鎌首」演出専用の範囲
  full_rear_max_deg: 90.0

# 質量配分（仮定値。実測したら差し替える）
mass_budget_g:
  servo_each: 55
  servo_count: 9
  segment_frame_each: 30
  segment_frame_count: 8
  passive_wheels_total: 60      # 受動輪 + ベアリング
  head_total: 90                # シェル + XIAO + ToF + LED
  skin_and_wiring: 115
  neck_lifted_mass: 200         # J7 が持ち上げる質量
  neck_lifted_cog_mm: 104       # J7 から重心までの距離

# ArUco マーカ（DICT_4X4_50, 50mm）。位置は尾端からの距離（胴体に沿って）
# 首マーカは J7 より胴体側（J6-J7 リンク上）。J7 より先だと鎌首でマーカが傾いて検出できない
# 台座: 60×60×厚さ3mm の平板（50mm マーカ + 周囲 5mm 余白）。外皮の上に載せる着脱式（マジックテープ/薄型磁石）
# 「装甲板・背中の鱗模様のパッチ」として意匠に組み込む。印刷は必ず艶消し（光沢は照明で反射して検出率が落ちる）
markers:
  dictionary: DICT_4X4_50
  size_mm: 50.0
  plate_mm: 60.0              # 台座の一辺
  plate_thickness_mm: 3.0
  tail_id: 0
  neck_id: 1
  tail_x_mm: 50.0             # 尾端-J1 リンクの中央（仮）
  neck_x_mm: 640.0            # J7 の 30mm 手前（マーカ半幅 20mm + 余裕 10mm）（仮）

# ヘビの位置姿勢推定（位置 = 首マーカ、θ_body = 尾→首、θ_head = θ_body + J8）
snake_pose:
  reference_gait: forward     # ローパスの時定数の基準にする歩容
  heading_tau_periods: 1.0    # θ_body のローパス時定数・窓の長さ（上の歩容の周期単位）
  # moving_average: 1周期の移動平均（蛇行の振れを打ち消し、遅れ τ/2）
  # lowpass: 一次遅れ（定常旋回で ω·τ 遅れる。旋回中は 40° 近く遅れた = STEP 5 の測定）
  heading_filter: moving_average
  stale_after_s: 1.0          # マーカがこれ以上見えなければ「位置不明」扱い
  # 位置の飛びの門（偽マーカ対策）。模擬の最速（MuJoCo WHEEL で約 160mm/s）の 2.5 倍と、
  # 検出誤差（模擬で p95 約 30mm）+ 遅れぶんの余裕。**実カメラで測り直す**
  max_speed_mm_s: 400.0
  jump_margin_mm: 80.0

# 自己干渉チェック（とぐろ等のポーズ検証）
self_collision:
  arc_skip_mm: 100.0          # 胴体に沿ってこれ以上離れた点どうしだけを比べる
  sample_mm: 5.0              # 中心線のサンプリング間隔
  min_clearance_mm: 60.0      # 中心線間の最短距離の下限（直径 50mm + 余裕 10mm）

# ---------------------------------------------------------------------------
# 歩容（gait equation: α(n,t) = A·sin(Ω·n + ω·t) + γ(n)、J1〜J6 の水平ヨーのみ）
#   n = 0(J1, 尾側) … N=5(J6, 頭側)。Ω>0, ω>0 で波は頭→尾へ伝わり、前進する
#   旋回入力はオフセット γ だけ（+ で左）。turn_profile で関節への配り方を選ぶ:
#     uniform       γ(n) = γ0          胴体全体が均一な円弧
#     head_weighted γ(n) = γ0·n/N      頭で舵を切って胴がついてくる
#   速度を上げるために周期を短くしないこと（展示機は静粛性優先）
# ---------------------------------------------------------------------------
gait:
  presets:
    forward:    {amplitude_deg: 30.0, spatial_freq_deg: 60.0, temporal_freq_hz: 0.5, turn_bias_deg: 0.0}
    slow:       {amplitude_deg: 20.0, spatial_freq_deg: 60.0, temporal_freq_hz: 0.3, turn_bias_deg: 0.0}
    # 忍び寄り（rectilinear 相当）。接近は速度差ではなく**波形の差**で意図を伝える。rectilinear locomotion は
    # 忍び寄り捕食・狭所で使われ 0.02〜0.07 BL/s、振幅は体長の 0.4〜1.3%（PMC3673153）。
    # 簡易シミュレータ（KINEMATIC_SIM）で 121mm/周期 → 30mm/s = 0.036 BL/s（体長 850mm）
    stalk:      {amplitude_deg: 8.0, spatial_freq_deg: 60.0, temporal_freq_hz: 0.25, turn_bias_deg: 0.0}
    backward:   {amplitude_deg: 30.0, spatial_freq_deg: 60.0, temporal_freq_hz: -0.5, turn_bias_deg: 0.0}
    # head_weighted は平均の重みが 1/2 なので、uniform と同じ半径には γ0 が 2 倍要る（γ0=20 で R≈480mm）
    turn_left:  {amplitude_deg: 30.0, spatial_freq_deg: 60.0, temporal_freq_hz: 0.5, turn_bias_deg: 20.0}
    turn_right: {amplitude_deg: 30.0, spatial_freq_deg: 60.0, temporal_freq_hz: 0.5, turn_bias_deg: -20.0}
  # uniform / head_weighted。同じ旋回率で比べると半径は同じ（約480mm）で、
  # 尾が頭の軌跡をなぞる精度は head_weighted が上（ずれ平均 91mm vs 115mm）→ 既定
  turn_profile: head_weighted
  phase_offset_deg: 0.0       # 歩容の初期位相（0 = sin の位相ゼロから始める）
  # 垂直波（ピッチ）。**この機体では出せない。**
  # J1〜J6 は全て yaw で、胴体に pitch 軸が無い（pitch は首 J7 のみ）。
  # 構想設計書 04章の「ヨーとピッチを交互に配置する直交2軸構成」とは構成が違う。
  # さらに、上下に波を伝えられると巻き付きが可能になるため、16章が螺旋歩容を封印している。
  # → **0 のまま。** 非ゼロにするには機構の変更と安全設計の見直しが要る（tests が拒否する）
  pitch_amplitude_deg: 0.0
  yaw_pitch_phase_deg: 90.0   # 上が 0 の間は未使用（直交2軸構成になったときの位相差）
  turn_ramp_periods: 1.0      # γ0 を 0 → turn_full_scale_deg だけ変えるのにかける時間（歩容の周期単位）
  turn_full_scale_deg: 20.0   # γ0 の変化の速さの基準（= 旋回プリセットの γ0）
  blend_s: 1.0                # 歩容の開始・停止時に振幅を 0↔1 でなめらかに変える時間

# ---------------------------------------------------------------------------
# 姿勢プリセット（関節角 deg。書いていない関節は変えない）
# ---------------------------------------------------------------------------
poses:
  # J7 = +8°: 頭をわずかに浮かせる（呼吸が下限で切れず、上下にゆっくり揺れて生きて見える）
  home: {J1: 0, J2: 0, J3: 0, J4: 0, J5: 0, J6: 0, J7: 8, J8: 0, J9: 0}
  # **R03 の休憩姿勢**: 緩い弧（合計 240°）。とぐろではない。
  # 旧とぐろ（329°巻き・J1=83°）は R03 の可動域に入らないので legacy_poses へ移した
  rest_arc: {J1: 45.3, J2: 43.0, J3: 40.9, J4: 38.8, J5: 36.9, J6: 35.1, J7: 8, J8: 0, J9: 0}
  # とぐろへの移り方: 尾から順に巻き、頭（J7 以降）を最後に引き込む
  coil_sequence:
    order: [J1, J2, J3, J4, J5, J6, J7, J8, J9]
    stagger_s: 0.5            # 隣の関節が動き始めるまでの遅れ
    per_joint_s: 1.5          # 各関節の補間時間
  # 鎌首: J7 で頭を持ち上げる。胴体の土台は arc（後方を軽く曲げる）。
  # 旧 s_curve（J4:25, J5:-35, J6:20）は生物学的に「打撃直前の S 字構え」（蛇の防御段階 ①逃走 → ②威嚇 → ③打撃。
  # California Herps: Defensive Strategies）なので演出から外し、legacy_poses（SIMULATION_LEGACY_ONLY）へ移した
  rear_up:
    default_angle_deg: 60.0
    default_base: arc
    bases:
      arc:          {J1: 40, J2: 34, J3: 28, J4: 0, J5: 0, J6: 0}    # 後方を軽く曲げる（R03 の範囲内）
  # 伸び（stretch）: 真上から見下ろすフル鎌首（J7 = neck.full_rear_min_deg）。**人がいないときだけ**。
  # 人を追跡中は「コブラが襲う直前」に見えるので、brain の guard が J7 を neck.look_max_deg に抑える
  stretch:
    hold_s: 2.5
    duration_s: 2.0           # いつ出すかは behavior.grammar（PATROL の while、alone_paused）
  # 脱力（タッチ時）: 首を下げ、トルクを落とす
  relax:
    neck_deg: 0.0             # J7 を下げる
    head_roll_deg: 0.0
    torque_ratio: 0.6
    duration_s: 2.0

# ---------------------------------------------------------------------------
# **SIMULATION_LEGACY_ONLY**: R03 の可動域（±50° CONDITIONAL）に入らない旧モーション。
# 実機では使わない。クランプして「同じとぐろ」として扱わないこと（形が別物になるため）。
# 展示用のとぐろは、R03 geometry と ±50° 候補の範囲で**別途再設計する**
# ---------------------------------------------------------------------------
legacy_poses:
  status: SIMULATION_LEGACY_ONLY
  reason: "R03 では胴体ヨーが ±50°（CONDITIONAL）。旧値は 83° / 55° で入らない"
  coil: {J1: 83.0, J2: 68.9, J3: 57.2, J4: 47.5, J5: 39.4, J6: 32.7, J7: 8, J8: 0, J9: 0}
  partial_coil: {J1: 60, J2: 50, J3: 40, J4: 0, J5: 0, J6: 0}
  s_curve: {J1: 0, J2: 0, J3: 0, J4: 25, J5: -35, J6: 20}   # 鎌首の旧土台。威嚇の S 字構えに見えるため演出から外した

# ---------------------------------------------------------------------------
# Floor Watch（床の落とし物）。**すべて DESIGN 値 / HARDWARE_UNVERIFIED。** 幾何の出典: 2026-09-25 のレビュー入力。
# 実写（手持ちカメラ、治具で頭と同条件）で置き換えるまで、合成画像でのパイプライン検証にだけ使う
# ---------------------------------------------------------------------------
api:                          # Home AI との境界（MQTT）。docs/task_event_api.md
  safety_state_period_ms: 2000   # safety_state を変化が無くても出す周期。受け側の失効（下）より十分短く
  safety_state_max_age_ms: 5000  # 受け側: 自分の時計でこれ以上届かなければ状態不明（停止扱い）
  mqtt_keepalive_s: 20           # LWT はブローカーが keepalive の 1.5 倍で出す（MQTT 3.1.1 §3.1.2.10）→ 約 30 s で OFFLINE

localization:                 # フェーズ 3: 自己位置（座標系 home、m / rad）。**すべて DESIGN / ASSUMED。実機で校正**
  tag_map_file: config/tags.yaml
  camera:                     # 頭カメラで AprilTag を見るときのパラメータ。解像度と f は floor_watch.camera.modes から（ASSUMED）
    mode: tag_vga
    height_m: 0.03            # 首を水平にしたときの床からレンズまで（未確認）
    forward_m: 0.30           # 機体基準点（胴 2 の IMU）からレンズまでの前後（節ピッチ 95mm × 3 前後。未確認）
    fov_deg: 65.0             # 水平視野（未確認）
    tag_search_pitch_deg: 0.0 # タグを探すときの首の俯角（0 = 水平。床を見るときは floor_watch.camera.pitch_deg）
  apriltag:
    family: tag36h11
    min_range_m: 0.15
    max_range_m: 2.5
    max_view_angle_deg: 60.0  # タグの面をこれより斜めから見ると検出しないとみなす
    sigma_range_frac: 0.03    # 距離誤差 = 3% × 距離（ASSUMED）
    sigma_bearing_rad: 0.01
    sigma_yaw_rad: 0.05
    gate_chi2: 11.3           # Mahalanobis のゲート（3 自由度 99%）。偽検出・誤 ID を捨てる
    hold_s: 1.0               # 最後の補正からこの時間は pose_source = APRILTAG、以後 ODOMETRY_IMU
    sim_miss_prob: 0.1        # 合成観測: 見えるはずのタグを見逃す確率
  odometry:                   # 歩容オドメトリ。1 周期の前進量は behavior.controller.advance_per_cycle_mm（要実機校正）
    sigma_along_frac: 0.15    # 前進量の 15% を誤差に積む（滑りは未測定 → HARDWARE_UNVERIFIED）
    sigma_lateral_frac: 0.10
    sigma_yaw_frac: 0.20      # IMU 無しで歩容の指令から回転を取るときの誤差（回転量の 20%）
    sigma_yaw_floor_rad: 0.005
    max_age_s: 1.0            # これ以上位相が更新されなければ「オドメトリ無し」
  imu:                        # BNO085（胴 2、I2C）。値は ASSUMED
    yaw_sigma_rad: 0.02       # 絶対 yaw の誤差（磁北基準。home との差はタグで補正するたびに取り直す）
    delta_sigma_rad: 0.005    # 1 ステップの yaw 差分の誤差（ジャイロ積分）
    yaw_drift_rad_per_s: 0.002
    max_age_s: 0.5
  start:                      # 自律走行 / inspect_point を受ける条件。σ と局所センサーの健全性で書く
    max_sigma_xy_m: 0.15
    max_sigma_yaw_rad: 0.20
    require_imu: true
  sim:                        # 閉ループ模擬（sim_run.py / tools/localization_sim.py）の経路。KINEMATIC_SIM 相当
    mat_center_home_m: [1.5, 0.0]   # 展示マットの中心を home のどこに置くか（縦一本の模擬。部屋は tags.yaml）
    imu_offset_rad: 0.7       # 模擬 IMU の磁北と home の向きの差（推定器は知らない）
    waypoints: [[2.5, -0.8], [2.5, 0.8], [0.5, 0.8], [0.5, -0.8]]   # 部屋の中の長方形（m）。最後の点から出発
    waypoint_reach_m: 0.1
    temporal_freq_hz: 0.3     # 歩容の周波数（前進 = advance_per_cycle_mm × 周波数 ≈ 0.11 m/s）
    max_turn_rad_s: 0.6
    turn_gain: 2.0
    true_yaw_noise_rad: 0.01  # 真の回転に乗る雑音（1 歩ごと。推定器は知らない）

floor_watch:
  findings_dir: output/findings   # 候補の切り抜きの保存先（原画像は保存しない）
  mission:                    # inspect_point の段取り（floorwatch/mission.py）
    speed_mm_s: 80.0          # 地点へ向かう速さ（人の近くは controller の制限が上書き）
    settle_s: 1.0             # 止まってから撮るまで（振動が収まるまで。実機で要調整）
    capture_s: 1.5            # 5 枚の撮影にかかる時間（実機で測る）
    goto_timeout_s: 120.0
    arrive_mm: 30.0           # 首マーカが「視野中心を地点に置く位置」にこの距離まで来たら停止
    coast_frac: 1.3           # 停止指令後の惰行 = 速さ × gait.blend_s × これ。KINEMATIC_SIM で 80mm/s・blend 1s のとき約 107mm（実機で要調整）
    max_retakes: 2            # 動いていたら撮り直す回数
    aim_max_deg: 25.0         # 線を候補へ向けるときの頭ヨーの上限
    max_aims: 2               # 線を候補へ向け直す回数の上限
    view_target_mm: 90.0      # 位置合わせ: 頭先端から地点までをこの距離に（床カメラの見える範囲 38〜147mm の中ほど）
    view_tol_mm: 30.0
    lat_tol_mm: 3.0           # 地点が線からこれ以上横にずれていたら頭ヨーで向け直す（線幅 3mm）
    line_aim_tol_mm: 2.0      # 撮った後: 線が候補の中心からこれ以上ずれ、決め手（metal_disc・測れた高さ）が無ければ向け直す（H2 VIS-0002/0006、合成）
    creep_speed_mm_s: 40.0    # 微調整の速さ。止めるときは振幅を即 0（惰行させない）
    burst_max_s: 1.0
    max_adjusts: 6
    reach_mm: 250.0           # 頭からこの距離の物だけ合成画像に入れる（視野の目安）
    crop_pad_px: 12
  camera:
    # 解像度ごとに f を持つ（2026-09-27）。**すべて ASSUMED**: FOV 65° から f = W/2/tan(32.5°) で逆算。型番と FOV は定規（100 / 300mm）で
    # 実測して置き換える。70〜200mm のピントも確認（ボケるならレンズ調整か OV5640）。床見は最大解像度の静止画、タグ探しは VGA
    modes:
      floor_still:        {width_px: 1600, height_px: 1200, f_px: 1256.0, note: "OV2640 UXGA 静止画（床見）。ASSUMED"}
      floor_still_ov3660: {width_px: 2048, height_px: 1536, f_px: 1608.0, note: "OV3660 QXGA 静止画（型番が OV3660 なら）。ASSUMED"}
      tag_vga:            {width_px: 640, height_px: 480, f_px: 502.0, note: "VGA 動画（タグ探し）。ASSUMED"}
      synthetic_ref:      {width_px: 640, height_px: 480, f_px: 1000.0, note: "合成の回帰試験用。2026-09-25 レビューの設計値（1.5mm → 21.3px）"}
    floor_mode: floor_still    # 床見に使うモード
    height_mm: 30.0            # 床からカメラまで（中立姿勢の候補）
    pitch_deg: 25.0            # 下向き。視野中心は床 71mm 先（= 30 / sin25°）
  line_light:
    lateral_mm: 30.0           # 投光部をカメラの横へ。**式には埋め込まない**（較正した面を使う）。合成画像の描画にだけ使う
    height_mm: 30.0            # 投光部の高さ（カメラと同じ）
    tilt_deg: 45.0             # 光の面を内側へ。床の線がカメラ中心線の真下を前後に走る。高さ 1mm → 横ずれ 1mm
    width_mm_initial: 3.0      # 線幅の初期値（床上 3mm ≈ 40px）。式には入れず、点灯−消灯の床画像から自動推定する
    physical_note: "0.3mm スリット 2 枚を 20mm 離した二重スリットで床上約 2mm の見込み（未検証）"
  normal_light:                # 通常照明（レンズのすぐ横）。照明の較正画像を今の姿勢に合わせ直すのに使う（VIS-0008）。**ASSUMED**
    led_height_mm: 30.0        # 床から（中立姿勢）。カメラと同じ高さの見込み
    led_forward_mm: 0.0        # カメラ直下からの前後位置
  raking:                      # 斜め照明はあごの位置（床から約 6mm、カメラの真下付近）から前向き。影は物の奥（画像の上側）
    led_height_mm: 6.0
    led_forward_mm: 0.0        # カメラ直下からの前後位置
    shadow_max_mm: 150.0       # LED より高い物の影は長く伸びる（合成の上限）
  calibration:
    coin_thickness_mm: 1.5     # 1 円玉。1・2・3 枚重ねの段で光の面を較正する
    stack_counts: [1, 2, 3]
  detect:
    # 画素単位のしきい値は reference_f_px（レビューの設計値）で決めた値。使うモードの f に比例して拡大する（面積は 2 乗）
    reference_f_px: 1000.0
    scale_with_f: [background_blur_px, blob_close_px, line_search_px, line_context_rows, line_min_rows, dropout_rows_min, line_baseline_rows, pose_rms_max_px]
    scale_with_f2: [min_blob_px]
    motion_max_px: 1.0         # 最初と最後の通常画像がこれ以上動いていたら撮り直し（画素。解像度に依らず「動いたか」）
    background_poly_degree: 2  # 背景 = 通常画像に頑健に当てはめた多項式の面。基準床は使わない（実機では同じ視点の空の床が無い）
    background_blur_px: 9      # 差分の前に木目の細かい縞を落とす
    blob_close_px: 15          # 前景の塊をつなぐ（木目でちぎれるのを防ぐ）
    diff_z: 3.0                # 背景との差分（ノイズ σ の倍数）で前景
    shadow_object_rows_ratio: 0.5   # 影だけの候補: 影の幅 × これ を物の行数とみなす（物は影の手前）
    noise_sigma_min: 2.0       # σ の下限（カメラ雑音の目安。合成では noise_sigma と同じ）
    shadow_ratio_max: 0.7      # 斜め/通常 の比（局所正規化後）がこれ以下なら影
    shadow_min_signal: 15.0    # 通常画像（全消灯を引いた後）がこれ未満の画素は影の判定に使わない（暗すぎて比が雑音になる。VIS-0005）
    flat_min_signal: 12.0      # 照明の較正画像（flat_normal / flat_raking、全消灯を引いた後）がこれ未満の画素は暗すぎて判定に使わない（VIS-0007）
    flat_repose: false         # 【試作・既定は切】照明の較正画像を今の姿勢に合わせ直す（線があれば床の線の姿勢、無ければ明るさの傾きで pitch だけ）。首が上がったときの巡回は 0.36 → 0.88 に戻るが、塊が大きくなる副作用が未解決（VIS-0008）
    shadow_band_min: 0.15      # 塊の奥（上）の帯にこの割合以上の影があれば「影あり」
    shadow_band_rows_ratio: 1.0   # 帯の高さ = 塊の高さ × これ（1 円玉の影 ≈ 18mm ≈ 塊の奥行き。2.0 だと帯が薄まり UXGA で 0.14 に落ちた）
    line_search_px: 120        # 予測した床の線の位置から左右にこの範囲で線を探す
    line_min_intensity: 60     # これ以上なら線が乗っている（全消灯を引いた後）
    line_rel_min: 0.25         # …または、この撮影の線の明るさ（山の中央値）のこの割合以上（小さい方を使う。露出が低いとき暗い汚れの上の線を「途切れ」と読まない。VIS-0007）
    line_abs_floor: 10         # 割合で下げても、これ未満は線と見なさない（雑音）
    line_context_rows: 12      # 物の前後の床上の線（局所基準）に使う行数
    line_min_rows: 3           # 高さを「測れた」とする最低行数
    pose_from_line: true       # 線があるとき、床の線からカメラの高さ・pitch のずれを推定して候補の床の位置を直す（VIS-0003/0006。SYNTHETIC で確認）
    pose_max_height_err_mm: 12.0   # 推定の探索範囲（名目からのずれ）。端に張り付いたら信用しない
    pose_max_pitch_err_deg: 6.0
    pose_rms_max_px: 3.0       # 床の線の当てはめの残差がこれ以下なら使う（f=1000 基準、scale_with_f）
    line_rough_z: 4.0          # 線だけの候補の閾値 = max(height_object_min_mm, この倍 × 床の線の揺れの頑健な σ)。毛足で誤報しない（VIS-0005）
    line_baseline_rows: 240    # 線だけの候補: 床の高さの基準を ±この行数の中央値で取る（全体の中央値にしない。姿勢のずれで床が坂に見える。VIS-0002）
    min_blob_px: 30
    object_min_diameter_mm: 2.0   # これより小さい塊は物としない（雑音・木目のかけら。飲み込みの危険も小さい）
    height_object_min_mm: 0.5  # これ以上なら「出っ張り」
    dropout_rows_min: 3        # 線の途切れがこの行数以上なら出っ張りの証拠（鏡面）
    line_aspect_min: 4.0       # 縦横比がこれ以上なら線状（継ぎ目・段差）
    metal_disc_diameter_mm: [3.0, 25.0]   # 途切れ + 円形 + この直径 → metal_disc（ボタン電池・磁石の可能性、危険物側）。
                                          # 下限 5.0 → 3.0（2026-09-29 VIS-0002）: 5mm の磁石球は大きさが約 10% 小さく出て 4.5mm になり、危険物側に回らなかった。
                                          # 下限は ingestion_size_mm の下限と同じにする（厳しくする方向）
    metal_disc_confidence: 0.6
    metal_disc_max_height_mm: 11.0   # 円形の判定で「0〜この高さのどこかにある円盤」と見なしてよい上限（LR44 2 個重ね 10.8mm まで）。
                                    # 高い物は上面が視差で奥へ写り、床へ投影すると前後に伸びる → 床の高さのまま判定すると円形でなくなる（H2 VIS-0002）
  synthetic:
    noise_sigma: 2.0
    shadow_factor: 0.35
  risk:
    # 誤飲リスクはサイズのしきい値 1 つで決めない（決定事項 9）。種類 × 大きさ × 確信度 × 子どもの距離 × 届くか
    ingestion_size_mm: [3.0, 32.0]      # この範囲の大きさは飲み込みうる（下限は粒、上限は幼児の口の目安。要根拠）
    kind_ingestion: {coin: 0.9, button_cell: 1.0, magnet: 1.0, medicine: 1.0, metal_disc: 1.0, washer: 0.9, bead: 0.8, food_crumb: 0.2, stain_or_pattern: 0.0, unknown: 0.5}
    kind_sharp: {coin: 0.1, button_cell: 0.1, magnet: 0.1, medicine: 0.0, metal_disc: 0.1, washer: 0.3, bead: 0.0, food_crumb: 0.0, stain_or_pattern: 0.0, unknown: 0.3}
    critical_kinds: [button_cell, magnet, medicine, metal_disc]   # score とは別枠で必ず通知（metal_disc = 分類器ができるまでの代用）
    critical_min_confidence: 0.05
    child_near_m: 2.0                   # 子どもがこれより近ければ距離係数 1（不明も 1 = 安全側）
    unreachable_factor: 0.5             # 子どもが届かない場所なら score をこの倍率に
  csar:                         # Child-Safe Attention Rules の実行条件（serpens/floorwatch/csar.py。User 採用 2026-09-29、数値は Engineering の案）
    far_trust_s: 3.0            # 「近くに人がいない」を最後に確かめてから信じる時間（撮影 capture_s 1.5 + 静止のゆとり）。切れたら UNKNOWN = NEAR 扱い
    near_hold_s: 5.0            # 近くで人が見えたら、見えなくなってもこの間は NEAR
    defer_capture_when_near: true   # 子どもが近い・不明のときは撮影（閃光で物を照らす）を後回し（R2）
    capture_wait_s: 20.0        # 後回しにして待つ上限。過ぎたら「未確認」として Task を終え、保護者へ知らせるのは Home AI（R4）
    retreat_mm: 300.0           # 判定の後、物から離れる距離（R3）。来た向きへ後ろ向きに
    retreat_timeout_s: 20.0
    look_at_person_max_deg: 25.0    # 子どもが近いとき、頭を人の方へ向ける上限（R5。近づく動きは入れない）

# ---------------------------------------------------------------------------
# 動きの質の評価（simulation/quality.py, tools/motion_quality.py）。**SIMULATED。相対比較に使う**
# ---------------------------------------------------------------------------
quality:
  # 静止 = 歩容の振幅がゼロ（呼吸は移動ではない。首マーカの速さで測ると呼吸の位相波を「移動」と数えてしまう）
  wave_min_turn_deg: 3.0          # 中心線の曲がりがこれ未満なら波として数えない（呼吸ぶんを除く）
  visible_head_change_deg: 1.0    # 一次反応の「可視変化」とみなす J8 の動き
  person_appear_s: 5.0            # 人が現れる時刻（一次反応・GAR の測定）
  person_xy_mm: [700.0, -300.0]   # 現れる位置（来場者側。頭の正面付近。真横だと J8 ±80° に入らず GAR が意味を失う）
  start: {x_mm: 600.0, y_mm: 1100.0, theta_deg: -90.0}   # 尾端の初期姿勢（来場者側を向く）
  # 回帰テスト（tests/test_motion_quality.py）の合格線。目標: 静止率 0.40〜0.60、一次反応 ≤ 0.30s、GAR 0.40〜0.60。
  # 可視波数は 9 軸案では 1 が上限（構造的制約）。LDJ は 120 秒で統制した値の帯（大きく崩れたら気づくため）
  thresholds:
    still_ratio: [0.35, 0.70]
    primary_latency_s_max: 0.30
    gar: [0.35, 0.65]
    visible_waves_min: 0.9
    head_ldj: [-30.0, -20.0]        # 2026-09-21 の測定 −25.5 前後（120 秒）。相対比較用の帯

# ---------------------------------------------------------------------------
# アニメーション
# ---------------------------------------------------------------------------
animator:
  default_accel_dps2: 2000.0
  overshoot_peak_ratio: 0.75  # オーバーシュート付き ease-out: 全体のこの割合で行き過ぎの頂点
  # キーフレームが joints[].max_speed_dps を超える速さを要求したら、時間を自動で延ばす
  # 頭（J7〜J9）の「打撃に見える速さ」を構造的に出さない（印象の要件。安全の上限ではない）。
  # ガラガラヘビの打撃は最大加速度 506 m/s²（約 52G）・35ms（Higham et al., Sci. Rep. 2017）。
  # 愛玩機は先端（J7 から頭先端まで body.head_tip_x_mm − J7.x_mm = 180mm）の加速度を 1G 以下に
  head_max_accel_g: 1.0
  head_min_rise_s: 0.2        # head_min_rise_deg 以上の頭の動きは立ち上がり 200ms 以上
  head_min_rise_deg: 5.0      # これ未満の微小な動き（一次反応のピクッ 2.5°）は下限を課さない
  # follow-through（到達後の減衰振動）の周波数。振幅・時定数は Keyframe 側（settle_amp_deg / settle_tau_s）
  settle_freq_hz: 2.0
  # 予備動作と減衰振動の既定値（anticipation あり → 魅力 4.27→4.83、follow-through あり → 知的印象 3.86→4.72:
  # Takayama, Dooley & Ju, HRI 2011, n=273）。頭の look_at と、胴体の大きな姿勢変化に使う
  anticipate: {head_deg: [3.0, 8.0], lead_s: [0.1, 0.3], min_travel_deg: 10.0}   # 小さな向き直しには付けない
  settle: {amp_deg: 5.0, tau_s: 0.3, joints: [J1, J2, J3]}   # 尾側 2〜3 関節を 5°→0、τ=0.3s
# 呼吸オーバーレイ（全軸に常時加算）。擬似呼吸は注視 +10.65s・やりとり +27.68s・アニマシー +0.69（IJSR 2026, n=75）
breath:
  # 軸ごとの振幅。生物の呼吸は背腹方向だが胴体に pitch 軸が無いので、J7（首ピッチ）を大きく取って
  # 頭の上下で表現する。胴体ヨーは小さく（poses.home の J7:+8° は下限で切れないための浮かせ。維持）
  amplitude_by_axis: {J1: 1.5, J2: 1.5, J3: 2.0, J4: 2.0, J5: 1.5, J6: 1.5, J7: 5.0, J8: 0.5, J9: 0.5}
  default_amplitude_deg: 1.5  # 上に無い軸（8軸案など config を変えたとき）
  period_s: 4.0               # 15回/分
  # 関節ごとの位相ずれ。旧 0（全軸同位相）は 6軸ぶんが累積して胴体が ±12° の曲率で C 字に丸まって伸び、
  # 呼吸ではなく「震え」に見えた。30° で極めてゆっくりした波が尾→頭へ伝わる
  phase_step_deg: 30.0
  fade_s: 0.5                 # ON/OFF を切り替えたときに振幅をなめらかに変える時間

# ---------------------------------------------------------------------------
# 展示台と 2D シミュレータ
# 世界座標: 原点 = マット左手前、単位 mm、床平面 XY、ヘビの向き θ（+X から反時計回り）
# ---------------------------------------------------------------------------
mat:
  width_mm: 1200              # X 方向
  depth_mm: 1200              # Y 方向
# 展示レイアウト（vol.3 からの変更: 床置きをやめ、高さ600mm の台に載せる）
#   y = 0 の辺 … 来場者側（ここだけ開放）   y = 1200 … 背面パネル（カメラはこちら側）
#   x = 0 / 1200 … モニターとスタッフ
exhibit:
  table_height_mm: 600        # 台の高さ（立ったまま見て、撫でられる高さ）
  rim_height_mm: 20           # マットの縁（落下防止 + 「世界の境界」）
  rim_inner_radius_mm: 10     # 縁の内側の角の R（垂直だと引っかかる）
  visitor_side: front         # 来場者は y = 0 側だけ
sim:
  dt_s: 0.01                  # 積分刻み
  # 受動輪があるリンク（0 = 尾端→J1, …, 6 = J6→J7）。7リンク × 2輪 = 14輪。J7 より先は車輪なし
  wheel_links: [0, 1, 2, 3, 4, 5, 6]
  # 頭部の接地パッド（PTFE / フェルト、等方摩擦）。9 = J9→頭先端。横方向も拘束しない
  pad_links: [9]
  contact_height_mm: 10.0     # リンク中点がこれより高ければ床から浮いている（鎌首の頭側）
  lstsq_rcond: 1.0e-6         # 最小二乗の打ち切り（まっすぐな胴体で前後が不定のとき 0 にする）
  # **摩擦の値は belly 節が持つ**（ここには置かない。二重管理をやめた）
  # Sim-to-Real 校正（tools/fit_sim.py）: belly プロファイルの tangential をこの範囲でスイープする
  fit_ratio_min: 0.0
  fit_ratio_max: 0.2
  fit_ratio_steps: 21
  fit_warmup_cycles: 2.0
  fit_measure_cycles: 3.0
  start_tail_x_mm: 150.0      # 初期姿勢（尾端の位置と、尾→頭の向き）
  start_tail_y_mm: 600.0
  start_theta_deg: 0.0

# ---------------------------------------------------------------------------
# 腹側の交換パーツ（CAD: Wheel Belly / Snake Belly）と、床との摩擦
#
# **摩擦係数はどれも未実測（HARDWARE_UNVERIFIED）。仮値を「現実の摩擦」として扱わない。**
# 実機ができたら tools/fit_sim.py で実測から同定し、ここを更新する。
# 接触は (横方向の重み, 進行方向の重み) の比で表す。1.0 = 滑らない、0 に近いほど滑る。
#   wheel  … 受動輪。横は滑らず（1.0）、進行方向はよく転がる（0.02）
#   snake  … 鱗状の腹。どちらも滑るが、横の方が滑りにくい（異方性摩擦）
# ---------------------------------------------------------------------------
belly:
  type: wheel                 # wheel / snake（実機では部品を交換する）
  friction_profile: MEDIUM    # LOW / MEDIUM / HIGH / ANISOTROPIC
  profiles:
    # 受動輪つき（現行の展示機）。MEDIUM が従来の値
    wheel:
      LOW:         {lateral: 1.0, tangential: 0.010}
      MEDIUM:      {lateral: 1.0, tangential: 0.020}
      HIGH:        {lateral: 1.0, tangential: 0.060}
      ANISOTROPIC: {lateral: 1.0, tangential: 0.005}   # 横は完全拘束、前後は極めて軽い
    # 鱗状の腹（車輪なし）。**推進が成立するかどうか自体が未検証**
    snake:
      LOW:         {lateral: 0.30, tangential: 0.10}
      MEDIUM:      {lateral: 0.50, tangential: 0.20}
      HIGH:        {lateral: 0.80, tangential: 0.40}
      ANISOTROPIC: {lateral: 0.70, tangential: 0.10}   # 鱗の向きで前後だけよく滑る
  # 頭部の接地パッド（PTFE / フェルト、等方摩擦）は belly の種類によらない
  pad: {lateral: 0.05, tangential: 0.05}

# ---------------------------------------------------------------------------
# 知覚（STEP 5）
# ---------------------------------------------------------------------------
# 購入要件: 1080p以上・広角90°以上が必須。720p は不可（40mm マーカで検出率 93〜98%。STEP 5 で検証）
camera:
  index: 0
  width_px: 1920
  height_px: 1080
  use_dshow: true             # Windows: DirectShow の方が起動が速い
  # レンズ位置 [x_mm, y_mm, 高さ_mm]（マット台面基準）。奥（背面パネル側）から見下ろす
  # 床からの高さ = exhibit.table_height_mm + 1100 = 1700mm
  position_mm: [600.0, 1370.0, 1100.0]
  target_mm: [600.0, 600.0, 0.0]   # 注視点（マット中心）。俯角 約55°
homography:
  file: config/floor_homography.json
  # 四隅のクリック順（世界座標）: 左手前 → 右手前 → 右奥 → 左奥
  corner_order: ["左手前 (0,0)", "右手前 (W,0)", "右奥 (W,D)", "左奥 (0,D)"]
aruco:
  marker_height_mm: 50.0      # マーカ面の床からの高さ（胴体の直径）
  max_marker_gap_mm: 650.0    # 尾↔首マーカの距離がこれを超えたら誤検出（胴体に沿って 590mm）
  print_dpi: 300              # tools/make_aruco.py の印刷解像度
  print_margin_mm: 5.0        # マーカの周りの白い余白（台座 60mm − マーカ 50mm の半分）
  # 小さいマーカ向けに調整した検出パラメータ（cv2.aruco.DetectorParameters の属性名そのまま）
  detector_params:
    cornerRefinementMethod: 1           # CORNER_REFINE_SUBPIX
    adaptiveThreshWinSizeMin: 3
    adaptiveThreshWinSizeStep: 4
    minMarkerPerimeterRate: 0.01
    polygonalApproxAccuracyRate: 0.05
    perspectiveRemovePixelPerCell: 8
person:
  model_path: models/yolo11n.pt   # 自動ダウンロードはしない（README 参照）
  imgsz: 480                  # 小さいほど速い（CPU 推論。制御周期への影響が減る）
  detect_hz: 5.0              # 人物検出の頻度（推論中は制御スレッドが待たされるので上げすぎない）
  conf_threshold: 0.4
  person_class_id: 0          # COCO の person
  max_range_mm: 1500.0        # マット中心からこの半径の外にいる人は無視
  visitor_side_y_max_mm: 0.0  # これより奥（y が大きい）にいる人は無視（来場者は y<0 側だけ）
  association_gate_mm: 400.0  # 前フレームの同じ人とみなす距離
  switch_hysteresis_s: 2.0    # 別の人の方が近い状態がこれだけ続いたら追跡を切り替える
  hold_s: 3.0                 # 検出0人になっても前回値を保持する時間
# 実機なしで知覚を試すための仮想カメラ（シミュレータの世界を斜め上から撮った絵を作る）
virtual_camera:
  width_px: 1920
  height_px: 1080
  # カメラは奥（背面パネル側）から手前を見下ろす。マット四隅（左手前, 右手前, 右奥, 左奥）が写る画素位置。
  # 奥から見るので世界の +x は画面の左向きになり、手前（y=0）の辺が画面の上に写る
  mat_corners_px: [[1350, 375], [570, 375], [360, 1035], [1560, 1035]]
  position_mm: [600.0, 1370.0, 1100.0]   # 仮想カメラの位置（実カメラと同じ。視差の再現用）
  person_height_mm: 1650.0
  person_width_mm: 450.0

# 模擬 Vision（Phase 4。serpens/sim/sim_vision.py）。仮想カメラの画像に本物の ArUco 検出を通す。
# **どちらも想定値（未実測）。** 実カメラが来たら処理時間を測って置き換える
vision_sim:
  frame_hz: 10.0              # 撮影と検出の頻度
  latency_s: 0.10             # 撮影から結果が制御へ入るまで（推論・転送の想定）

# ---------------------------------------------------------------------------
# 内部状態と行動（STEP 6）。数値は全部ここ。実機を見ながら必ず変える
# ---------------------------------------------------------------------------
behavior:
  tick_hz: 50.0
  seed: null                  # 乱数の種（null = 毎回違う。テストでは固定）
  # 内部状態（仕様: docs/internal_state_model.md）
  #   dx/dt = −(x − baseline)/τ + Σ gain × 刺激。0〜saturation にクランプ。
  #   τ = decay_tau_s（baseline より上から下がるとき）/ rise_tau_s（baseline より下から戻るとき）。gains の負値は抑制
  # 刺激: presence(人がいる 0/1) proximity(近さ 0〜1) approach(人が近づく速さ 0〜1) touch(タッチ 0/1)
  #       novelty(新しい人、減衰する 0〜1) looking(人の方を向いている 0/1) alone(誰もいない 0/1)
  #       calm(人がいて・近づいて来ず・Stress が低い = 安全なやりとりが続いている 0/1)
  internal:
    curiosity:   {baseline: 0.40, rise_tau_s: 20.0, decay_tau_s: 20.0, saturation: 1.0,
                  gains: {novelty: 0.60, alone: 0.015, proximity: -0.02, calm: 0.02}}   # calm: 落ち着いて見ている間に好奇心が育つ（接近の持続）
    affection:   {baseline: 0.30, rise_tau_s: 60.0, decay_tau_s: 60.0, saturation: 1.0,
                  gains: {touch: 0.25, proximity: 0.02, looking: 0.01}}
    # approach の平衡値 = baseline + gain × tau × approach = 0.05 + 0.72·approach → 歩いて来る人（0.5〜1.0）で
    # 0.41〜0.77。**旧 0.90 は approach 0.18（毎秒 88mm）で 1.0 に飽和し、RETREAT だけが残って永久に逃げた**
    # （外部レビュー Bug-1）。saturation 0.9: (1−s) が 0 にならない = APPROACH/ENGAGE/OBSERVE が同時に消えない
    stress:      {baseline: 0.05, rise_tau_s: 6.0,  decay_tau_s: 6.0,  saturation: 0.9,
                  gains: {approach: 0.12, novelty: 0.05}}
    attention:   {baseline: 0.10, rise_tau_s: 3.0,  decay_tau_s: 3.0,  saturation: 1.0,
                  gains: {presence: 0.25, proximity: 0.30, looking: 0.20}}
    # 慣れ（同じ人との安全なやりとりで上がり、退避・駆け込み・人の入れ替わりで下がる。誰もいないと 5 分でゆっくり抜ける）
    #   calm 1 分で 0.3、近くで撫でられると速い。効き方: Stress の approach gain と駆け込みの驚きを最大 50% 弱め、
    #   APPROACH / ENGAGE を最大 30% 強める（初対面は変えない。utility.py, brain.py）
    familiarity: {baseline: 0.0,  rise_tau_s: 60.0, decay_tau_s: 300.0, saturation: 0.9,
                  gains: {calm: 0.005, proximity: 0.004, touch: 0.05}}
    # 眠気（誰もいない時間で溜まり、人・新しさで抜ける）。SLEEP の効用に入る
    sleepiness:  {baseline: 0.10, rise_tau_s: 60.0, decay_tau_s: 300.0, saturation: 1.0,
                  gains: {alone: 0.006, presence: -0.05, novelty: -0.10}}
  # 一度きりの出来事による段差（kick）。慣れの効き方（familiarity_*）もここ
  kicks:
    retreat_familiarity: -0.15      # RETREAT に入ったら慣れが下がる
    rush_familiarity: -0.10         # 駆け込まれたら慣れが下がる
    new_person_familiarity_keep: 0.5    # 追跡する人が入れ替わったら慣れはこの倍率に
    familiarity_stress_relief: 0.5  # Stress の approach gain と駆け込みの驚きを (1 − relief × 慣れ) 倍
    familiarity_social_boost: 0.3   # APPROACH / ENGAGE を (1 + boost × 慣れ) 倍（初対面は 1 倍）
  energy:                     # Energy = 1 − 活動の疲れ（**キャラクターの状態。サーボ温度は混ぜない** → thermal）
    # 活動の疲れ（Bug-2: 温度だけだと冷えている間は気分の休憩が一度も起きない）
    #   d(fatigue)/dt = gain_move × (歩容が動いている) − fatigue / tau_recover_s
    # 巡回は stop-and-go で動いているのは約半分なので、平衡値 = gain × 0.5 × tau = 0.48。
    # COIL_REST_MOOD が PATROL に勝つのは fatigue ≈ 0.42 → 巡回 約4分で休み、静止 20〜30 秒で戻る目安。
    # （レビュー案の 0.004 は連続歩行の前提。stop-and-go では平衡 0.24 で一度も休まない）**実機で要調整**
    fatigue: {gain_move: 0.008, tau_recover_s: 120.0}
  # サーボ温度（**機械の状態。Safety layer**）。過熱の強制休憩は behavior.safety.overheat_c（55℃）。
  # その手前の rest_request_c からは Behavior 側へ「休ませたい」を出す（COIL_REST_MOOD の効用に加点）
  thermal:
    fresh_c: 32.0             # これ以下なら涼しい（表示用）
    rest_request_c: 45.0      # これ以上で休憩要求（overheat_c より手前。実機で要調整）
    rest_request_boost: 0.8   # 休憩要求中に COIL_REST_MOOD の効用へ足す値（weight を掛ける前）
  stimuli:
    calm_stress_max: 0.3      # Stress がこれ以下で、人が近づいて来ていなければ calm = 1
    approach_ref_mm_s: 500.0  # 人がこの速さで近づくと approach = 1
    # 駆け込み（驚き）: 一次遅れは接近「距離」を積分するだけなので、approach だけでは歩行と突進を区別できない。
    # 人がこの速さを超えて迫ったら Stress を一段上げる（→ RETREAT）。歩いて来る来場者は 250〜500mm/s。要調整
    rush_mm_s: 700.0
    rush_stress_kick: 0.45    # 「臆病さ」のつまみ。0.45 で RETREAT(1.8·s) が ENGAGE に勝つ
    rush_rearm_s: 3.0         # 同じ突進で何度も上げない
    approach_lpf_s: 0.5       # 人の速度のローパス
    novelty_decay_s: 3.0
    looking_tolerance_deg: 15.0
    touch_hold_s: 0.5         # タッチ刺激を保つ時間
  # 安全割り込み（最優先。他のすべてを中断する）
  safety:
    overheat_c: 55.0            # サーボ最高温度がこれを超えたら強制休憩（COIL_REST_HEAT）
    overheat_resume_c: 45.0     # これ以下に下がるまで強制休憩を続ける
    grab_load_ratio: 0.75       # どれかの軸の負荷率がこれを超え
    grab_hold_s: 0.8            # この時間続いたら「掴まれた」とみなして脱力（PETTED）
    fence_stop_reason: "安全: マット端。停止して中央へ向き直る"
    # 停止の種類（serpens/safety.py）。停止で勝手にホーム姿勢へ動かしたり脱力したりしない
    stop:
      emergency_action: hold        # hold（姿勢保持）/ disable_torque（脱力。**実機未検証**）
      hold_resend_hz: 20.0          # 停止中に保持指令を送り直す頻度（最後の目標まで動き続けるのを止める）
      disable_torque_on_exit: false # 終了時に脱力するか（既定は保持したまま切断。**実機未検証**）
    # テレメトリの鮮度。これより古い値は「不明」として扱い、正常表示にしない
    telemetry:
      stale_after_s: 2.0
    # 実機の自律走行を許可する条件（シミュレーションのデモには適用しない）
    autonomy:
      require_real_pose: true       # 実観測の自己位置が必要。仮想位置では走らせない
      # 実観測と認める出どころ。require_sigma の出どころは σ と局所センサーの健全性（localization.start）でも判定する
      # （フェーズ 3。「ArUco → AprilTag の置換」ではなく σ で書く）。aruco = 検証用の外部カメラ（EX-01 の経路）
      pose_sources:
        apriltag: {require_sigma: true}
        odometry_imu: {require_sigma: true}
        aruco: {require_sigma: false}
      pose_max_age_s: 0.5
      require_calibration: true     # 床の校正ファイルが必要
      require_drive_link: true      # ESP32 駆動リンク（heartbeat）が必要。Phase 2 までは実機走行不可
  # 効用（utility.py の式の係数）
  utility:
    # ±15%。hysteresis 1.15 に対し最大比 1.15/0.85 = 1.35 → 拮抗した状態が入れ替わる（個体差・ゆらぎ）。
    # 旧 0.08 は最大比 1.17 で hysteresis をぎりぎりしか超えず、ほぼ効いていなかった（Bug-3）
    noise_ratio: 0.15
    noise_period_s: 2.0       # 乱数を引き直す間隔（毎周期だとチラつく）
    hysteresis: 1.15          # 今の状態の効用 × これ を超えないと切り替えない
    min_dwell_s: 4.0          # 最小継続時間
    # 割り込みの優先度: safety（brain が force）> PETTED > ALERT（brain が force）> 効用で選択
    interrupt_states: [PETTED]
    # 割り込まれない状態（安全のため。人が来ても抜けない）
    uninterruptible_states: [COIL_REST_HEAT]
    # 状態ごとの最小継続時間
    #   COIL_REST_HEAT … 過熱の強制休憩。60 秒、人が来ても割り込めない
    #   COIL_REST_MOOD … 気分の休憩。20 秒、人が来たら ALERT へ抜ける
    min_dwell_overrides: {PETTED: 2.0, ALERT: 2.0, COIL_REST_MOOD: 20.0, COIL_REST_HEAT: 60.0, SLEEP: 8.0}
    weights: {SLEEP: 0.9, PATROL: 1.0, ALERT: 1.6, OBSERVE: 0.9, APPROACH: 1.4, ENGAGE: 1.3, PETTED: 3.0, RETREAT: 1.8,
              COIL_REST_MOOD: 1.1, COIL_REST_HEAT: 0.0}   # HEAT は効用では選ばれない（安全割り込みでのみ入る）
    engage_distance_mm: 450.0 # 頭先端から人までこれ以内なら「近い」（ENGAGE）。停止距離 400mm より少し外側
    # ためらい: 新奇なうちは近づかない。APPROACH × (1 − hesitation × novelty)。novelty は 3 秒で減衰するので
    # 気づいた直後は OBSERVE（見る・追う）が勝ち、数秒して APPROACH へ移る（NOTICE→LOOK→HESITATE→TRACK→APPROACH）
    approach_novelty_hesitation: 0.8
  # 移動（controller.py）
  controller:
    gait: forward             # 振幅・空間周波数の元にする歩容
    advance_per_cycle_mm: 380.0   # 1周期の前進量。要実機校正（fit_sim.py の結果に合わせる）
    stalk_gait: stalk             # 接近（APPROACH）に使う歩容
    stalk_advance_per_cycle_mm: 121.0   # stalk の 1周期の前進量（KINEMATIC_SIM、sim/measure.py）。要実機校正
    min_temporal_freq_hz: 0.10    # これより遅い蛇行はしない（周期 10 秒）
    speed_patrol_mm_s: 120.0
    speed_approach_mm_s: 50.0     # h. 近づくときは遅く
    speed_retreat_mm_s: 150.0     # h. 離れるときは速く（ただし 1m 以内は下の制限が優先）
    near_person_mm: 1000.0        # 人のこの距離以内では
    near_speed_limit_mm_s: 80.0   #   最高速度 8cm/s
    stop_distance_mm: 400.0       # 頭先端から人までこの距離で必ず停止
    # 歩容を止めてからの惰性 = 速さ × gait.blend_s × これ。
    # 実測: 50mm/s で指令して停止 → 1秒のブレンド中に約80mm 進む（= 1.6）
    coast_ratio: 1.6
    head_reach_mm: 210.0          # 首マーカ → 頭先端の距離（停止判定用）
    heading_gain: 0.4             # γ0 = gain × 向きの誤差[deg]
    max_turn_deg: 20.0            # γ0 の上限
    arrive_mm: 120.0              # 巡回の目標点に着いたとみなす距離
    mat_margin_mm: 120.0          # 仮想フェンス（硬）: ここに首の先読み点が入ったら前進をやめて向き直る
    # 仮想フェンス（柔）: 端からこの距離に入ったら、目標の方位を中央の方位へ少しずつ寄せる。
    # 旋回半径が約480mm あるので、硬いフェンスに来てから曲がったのでは間に合わない
    fence_soft_mm: 300.0
    forward_min_s: 1.5            # 前進に戻ってから、次に後退へ入るまでの最小時間
    back_min_s: 2.0               # 後退の最小継続時間（すぐ切り替えると往復して動けなくなる）
    turn_min_s: 2.0               # 向き直りの最小継続時間
    back_exit_mm: 250.0           # 後退をやめる距離（頭先端から端まで）。マットが 1.2m なので最大でも 390mm
    tail_margin_mm: 60.0          # 後退するとき、尾に必要なマット上の余裕（胴体半径 25mm + 余裕）
    # 巡回: 中央の円（半径 patrol_radius_mm）の上に目標点を置いて追う。
    # 目標点は中央 400×400mm の中に収まる。端へ寄らないので、フェンスからの復帰がほぼ起きない
    patrol_radius_mm: 200.0
    patrol_lead_deg: 50.0         # 現在位置より何度先に目標点を置くか
    patrol_flip_s: [25.0, 60.0]   # この間隔で回る向きを変える（同じ向きに回り続けると単調）
    # stop-and-go（間欠移動）。間欠移動する動物は移動時間の平均約50%（範囲6〜94%）を静止に費やす
    # （Integr. Comp. Biol. 41(2):137）。歩き続けると「ルンバ」に見える。静止中も呼吸は続く。
    # 期待値 3s 動いて 4s 止まる（歩容の立ち上がり・立ち下がり blend_s が動く側に乗る）。静止中は騒音ゼロ
    patrol_move_s: [2.0, 4.0]
    patrol_pause_s: [3.0, 7.0]     # 歩容の立ち下がり（blend_s 約 1s）が動く側に乗るので、静止率 0.4〜0.6 にはこの長さが要る
    lookahead_mm: 250.0
    recover_heading_ok_deg: 45.0  # 中央を向いたとみなす誤差
    retreat_distance_mm: 900.0    # 逃げるときの目標: 人から離れた点までの距離
  # 生き物らしさ（expression.py）
  expression:
    reaction_delay_s: [0.4, 0.9]      # b. 人物検出から反応開始まで（「間」。primary の後）
    # 一次反応の素材（いつ撃つかは grammar.on_notice）。因果の印象は遅延 140ms を超えると消え始め 1 秒で崩壊する
    # （Front. Psychol. 14:1167809 / Sci. Rep. 10:22384）。目の LED は機械遅延ゼロなので LED だけでも成立する
    primary_twitch_deg: 2.5
    primary_twitch_s: 0.12            # 片道の時間（往復で 0.24s）
    primary_flash_brightness: 255
    primary_flash_s: 0.15
    surprise_freeze_s: 0.3            # c. 反応の最初は全停止（呼吸は除く）
    # 舌のちらつき相当（舌が無いので J8 の微小往復で代替）。ガータースネークの舌フリック実測
    # （Chiszar et al., Bull. Psychon. Soc.）: 新奇環境直後 約51回/分 → 馴化後 2〜4回/分、新規刺激で 8〜10回/分。
    # 頻度 = base + (peak − base) × novelty。どの状態で出すかは grammar（rate_per_min: novelty）
    flick:
      yaw_deg: [3.0, 8.0]
      duration_s: [0.2, 0.4]          # 往復で1回
      base_rate_per_min: 3.0
      peak_rate_per_min: 9.0
    surprise_keep_breath: true        #    止まっている間も呼吸は続ける（止めると「物体」に戻る）
    look_overshoot_deg: [3.0, 5.0]    # d. 頭の回転の行き過ぎ
    # d. 到達後のホールド。相互凝視の快適時間は平均 3.3 秒・大多数が 2〜5 秒（Binetti et al., R. Soc. Open Sci., n≈500）
    look_hold_s: [2.5, 4.0]
    look_duration_s: 0.6              # d. 頭を回す時間（軸の上限速度で自動的に延びる）
    look_retarget_deg: 12.0           #    ホールド中でもこれ以上ずれたら向き直す（stimuli.looking_tolerance_deg 15 より小さく。GAR の測定で判明）
    tilt_deg: [12.0, 18.0]            # e. 首かしげ（J9）
    tilt_hold_s: 1.2
    # g. 視線そらし（glance_away）。間隔は grammar（every）。GAR（そらしている時間の割合）0.5〜0.7 が会話を
    # 最も長くし、0.1 だと短くなる（Front. Robot. AI 10:1062714）。旧 15〜40 秒に 1.5 秒 = GAR 約 0.04
    glance_away_s: [2.5, 4.5]         # 測定（tools/motion_quality.py）で GAR 0.4〜0.6 に入る長さ。every は grammar（4〜8s）
    glance_max_yaw_deg: 60.0
    glance_min_offset_deg: 25.0       # そらす先はいまの向きからこれ以上離す（偶然「見ている」範囲に入らない）
    approach_first_ratio: 0.6         # f. 接近は 60% 進む → 止まる → 残り
    approach_pause_s: [0.8, 1.5]
    # i. 撫でへの応答の素材（3 段: 呼吸を止める → 脱力 → すり寄る。時刻は grammar.PETTED）。
    # Paro は撫でに尾と目の二点で応答し、10 分の接触で痛みの主観評価 5.1→3.1（Sci. Rep. 10:9747, n=83）。
    # 頭部のタッチは 2 点（頭・背）で左右が分からないので、すり寄る向きは追跡中の人の方向（いなければ乱数）。
    # 胴体タッチセンサはハード側へ要求済み
    petted:
      nuzzle_deg: [10.0, 20.0]
      nuzzle_duration_s: [1.0, 2.0]
    engage_neck_deg: 60.0             # 人を見るときの J7（neck.look_* の範囲にクランプ）
    alert_neck_deg: 55.0
    eyes_refresh_s: 1.0               # 目の指令を送り直す間隔（ESP32 は 3 秒来ないと呼吸に戻る）
    sleep_neck_deg: 0.0               # 眠るときは頭を床に下ろす
  # ---- 文法（grammar.py）: 状態ごとに、どの語彙（primitives.py）をいつ撃つか。**動きの人格はここだけで変える** ----
  #   on_notice … 人に気づいた出来事。<STATE>.on_enter … 入ってから at 秒後。<STATE>.while … every 秒ごと / rate_per_min
  #   only: paused（巡回の静止中） / alone_paused（静止中かつ誰もいない） / person（人を追跡中）
  # 「もう少し臆病に」= on_notice の at を長く・ALERT の flick を増やす、など
  grammar:
    on_notice:                                  # 一次反応（150〜250ms）。「間」の全停止は expression.reaction_delay_s
      - {do: eye_flash, at: [0.15, 0.25]}
      - {do: twitch,    at: [0.15, 0.25], toward: person}
    ALERT:
      on_enter: [{do: flick, at: 1.2, times: 3, gap_s: 0.5}]
      while:    [{do: glance_away, every: [4.0, 8.0]}]
    OBSERVE:
      while:
        - {do: flick, rate_per_min: novelty}
        - {do: tilt, every: [5.0, 10.0]}
        - {do: glance_away, every: [4.0, 8.0]}
    ENGAGE:
      while:
        - {do: flick, rate_per_min: novelty}
        - {do: tilt, every: [5.0, 10.0]}
        - {do: glance_away, every: [4.0, 8.0]}
    APPROACH:
      while: [{do: glance_away, every: [4.0, 8.0]}]
    RETREAT:
      while: [{do: glance_away, every: [4.0, 8.0]}]
    PATROL:
      while:
        - {do: glance_away, every: [4.0, 8.0]}
        - {do: flick, rate_per_min: novelty, only: paused}
        - {do: stretch, every: [40.0, 90.0], only: alone_paused}
    PETTED:                                     # 撫でへの 3 段応答
      on_enter:
        - {do: hold_breath, at: 0.0, hold_s: 0.2}                    # 接触から 200ms 以内: 呼吸を一瞬止める
        - {do: sag, at: [0.3, 0.8], torque_ratio: 0.4, release_s: 2.0}   # 脱力（トルク 40%、姿勢が沈む）
        - {do: nuzzle, at: [1.0, 1.4], toward: person}               # 接触方向へ 10〜20° すり寄る
    SLEEP: {}
    COIL_REST_MOOD: {}
    COIL_REST_HEAT: {}
  # 目（状態ごと）: [R, G, B, 明るさ, モード(0消灯 1点灯 2呼吸 3まばたき)]
  eyes:
    SLEEP: [60, 60, 120, 20, 2]
    PATROL: [0, 160, 120, 90, 1]
    ALERT: [255, 180, 0, 255, 1]
    OBSERVE: [0, 200, 255, 160, 3]
    APPROACH: [0, 220, 180, 180, 1]
    ENGAGE: [255, 120, 160, 200, 3]
    PETTED: [255, 150, 180, 30, 2]    # i. 目を暗く
    RETREAT: [255, 60, 0, 220, 1]
    COIL_REST_MOOD: [80, 80, 160, 25, 2]
    COIL_REST_HEAT: [255, 80, 0, 60, 2]     # 過熱の強制休憩は分かる色にする

# ---------------------------------------------------------------------------
# 安全の絶対値（出典: ../蛇ロボット_HomeAI_構想設計書.pdf 16章「安全性 — 4重の防御」）
# **ソフトの都合で緩めない。** 導出と現状の達成度は docs/safety_limits.md
# ---------------------------------------------------------------------------
safety_limits:
  # ---- トルク: 出どころの違う4つを別々に持つ ----
  torque:
    # REFERENCE（STS3215-C044 7.4V / 1:191。**実測ではない**）。2026-09-29 に User 承認で現行資料の値へ更新:
    #   Seeed / Feetech の製品ページ（2026-09-29 に確認）: ストール 27.4 kgf·cm / 定格 9 kgf·cm
    rated_torque_reference_nm: 0.883      # 9 kgf·cm
    stall_torque_reference_nm: 2.687      # 27.4 kgf·cm。**連続安全トルクとして使わない**
    # 旧 REFERENCE（CAD 資料由来）は **stale / source-unverified**。元出典を確かめるまで矛盾として残す（削除しない。OQ-0103）
    stale_rated_torque_reference_nm: 0.510   # 5.2 kgf·cm
    stale_stall_torque_reference_nm: 1.569   # 16 kgf·cm
    # ソフトが出してよい上限。rated 以下に取る（構想設計書16章の 1.2N·m より、サーボの定格が先に効く）。**N·m の上限は変えていない**
    software_torque_limit_nm: 0.450
    # サーボのトルク制限レジスタへ書く比（ストール基準。= software / stall_reference）
    # 2026-09-29: 0.287（ストール 16 前提）→ 0.167（User 承認、OQ-0108）。ストールが 27.4 なら 0.287 では約 0.77 N·m 出るため。
    # **H1 で実測したストール・トルク制限の効きで作り直す**（hardware/prototypes/H1_joint/README.md）
    software_torque_limit_ratio: 0.167
    # **実測して初めて埋まる。** 埋まるまで実機の自律走行は許可しない
    measured_safe_torque_nm: null
    hardware_verified: false
    source: SIMULATED_FROM_REFERENCE
  torque_nm_max: 1.2          # 構想設計書16章の L0 上限（サーボ非依存の上限）
  min_bend_radius_mm: 40.0    # 中心線の最小曲げ半径。巻き付きを機構で不可能にする（16章の最重要）
  mass_total_g_max: 1700
  near_person_mm: 1000        # この半径内では
  near_speed_limit_mm_s: 80   # 8cm/s を超えない（behavior.controller はこれ以下であること）
  servo_temp_stop_c: 80       # 構想設計書の L0。本機は link.faults.temp_limit_c(60) で手前から止める
  contact_release_ms: 20      # 接触検知 → 脱力の目標。**現状 800ms。未達**（docs/safety_limits.md）
  comms_loss_safe_ms: 3000    # 構想設計書の目標。本機は 400ms で保持（より厳しい）
  # ---- ELECTRICAL_SAFETY_GATE（docs/safety_limits.md §5）----
  # 実機で測って証拠（日付・条件・測定器）を書くまで COMPLETE にしない。
  # **1 項目でも INCOMPLETE なら実機の自律走行は許可しない**（serpens/electrical_gate.py）。
  # 模擬の結果でここを埋めない。
  electrical_safety_gate:
    real_current:          {status: INCOMPLETE, evidence: null, what: "9軸の実電流（待機・歩容・ストール）"}
    power_capacity:        {status: INCOMPLETE, evidence: null, what: "電源容量と電圧降下（全軸同時の突入を含む）"}
    overcurrent_protection: {status: INCOMPLETE, evidence: null, what: "過電流保護（ヒューズ/ポリスイッチ/電子遮断）が働くこと"}
    wiring_heat:           {status: INCOMPLETE, evidence: null, what: "配線・コネクタの発熱（連続運転）"}
    independent_power_cut: {status: INCOMPLETE, evidence: null, what: "ESP32 に依存しないサーボ電源の遮断経路"}
    physical_estop:        {status: INCOMPLETE, evidence: null, what: "人が手で押せる物理の緊急停止"}
    servo_temperature:     {status: INCOMPLETE, evidence: null, what: "実サーボの温度上昇と 60℃ 停止の実働"}
    real_stop_time:        {status: INCOMPLETE, evidence: null, what: "緊急停止・通信断から実際に止まるまでの時間"}

# ---------------------------------------------------------------------------
# サーボ STS3215（出典は docs/sts3215_registers.md）
# ---------------------------------------------------------------------------
servo:
  # **プロファイルの数値は STS3215-C044（7.4V / 1:191）の CAD 参照値。未購入・未実測。**
  # 2026-09-27: 暫定の採用候補は 秋月 g116312 = C001（7.4V / **1:345**、ページ値 19.5kgf·cm、未実測）。1:191 は古い資料。
  # C001 の定格・ストールが確認できたら、このプロファイルと software_torque_limit_ratio（ストール比）を作り直す。
  # 旧 12V・1:345（30kgf·cm）の値を 7.4V 版へ流用しないこと。値の出どころが違う
  model: STS3215-C044
  nominal_voltage_v: 7.4
  gear_ratio: "1:191"
  hardware_verified: false
  # REFERENCE 値（7.4V 時）。**実測ではない。** 2026-09-29 に現行の Seeed / Feetech 資料の値へ更新（User 承認）。
  # 設計判断には H1 の実測値を使う（User 指示 2026-09-29）
  rated_torque_reference_kgfcm: 9.0      # 連続で出せるとされる値
  stall_torque_reference_kgfcm: 27.4     # **連続安全トルクとして使わない**（起動・拘束時の最大）
  # 旧 CAD 資料の値。**stale / source-unverified**。元出典を確かめるまで矛盾として残す（OQ-0103）
  stale_rated_torque_reference_kgfcm: 5.2
  stale_stall_torque_reference_kgfcm: 16.0
  torque_reference_source: VENDOR_PAGE_2026-09-29   # Seeed / Feetech 製品ページ。旧 CAD_REFERENCE は stale_* に残す
  baudrate: 1000000
  steps_per_rev: 4096
  center_step: 2047          # [W] の中立位置。[M] の「2048 校正」とは 1step 差
  step_min: 0
  step_max: 4095
  speed_max_step_s: 3400     # [M] 運転速度の最大
  speed_min_step_s: 1        # 0 の意味が資料に無いので書かない
  accel_unit_step_s2: 100    # 加速度レジスタ 1 あたり
  accel_reg_min: 1           # 0 の意味が資料に無いので書かない
  accel_reg_max: 254
  voltage_unit_v: 0.1
  load_unit: 0.001           # 現在負荷 1 あたり（デューティ比）
  # 現在負荷の符号ビット。公式資料に記載なし。SCS/STS 系で一般的な
  # 「下位10bit = 大きさ、bit10 = 方向（0=CW / 1=CCW）」を【仮説】として採用。実機で要検証
  load_sign_bit: 10
  torque_limit_full: 1000    # トルク制限 1000 = 100%
  temperature_limit_c: 70    # [M] 最高温度の初期値
  supply_voltage_v: 7.4      # 電源電圧（tools/servo_setup.py が EEPROM の電圧設定と比べる）
  sync_read: true            # SYNC READ を使う（非対応なら自動で個別 READ に落ちる）

# 状態の読み出し頻度。SYNC READ 非対応（個別 READ）だと遅いので頻度を落とす
servo_poll:
  position_hz_sync: 50.0      # SYNC READ が使えるとき
  position_hz_fallback: 10.0  # 個別 READ のとき
  thermal_hz: 1.0             # 負荷・電圧・温度（Energy・GUI 用）

# ---------------------------------------------------------------------------
# モックサーボ（シミュレーション用の模擬値。実機の挙動に合わせて調整する）
# ---------------------------------------------------------------------------
mock_servo:
  position_tau_s: 0.08       # 目標角への一次遅れ時定数
  integration_step_s: 0.002  # 内部の積分刻み（安定のため position_tau_s より十分小さく）
  initial_deg: 0.0
  load_per_speed: 0.25       # 最高速度で動いたときの負荷率
  load_per_error_deg: 0.01   # 目標との偏差 1° あたりの負荷率（保持トルク）
  ambient_c: 25.0            # 環境温度
  heat_tau_s: 300.0          # 温度の一次遅れ時定数（Energy の演出テストでは短くする）
  heat_gain_c: 30.0          # 負荷率 1.0 を続けたときの温度上昇（平衡値）
  holding_heat_c: 2.0        # トルク ON で静止しているときの温度上昇（平衡値）
  voltage_nominal_v: 7.4
  voltage_sag_v: 0.6         # 負荷率 1.0 あたりの電圧降下

# ---------------------------------------------------------------------------
# 頭部 I/O（XIAO ESP32S3、USB CDC）
# ---------------------------------------------------------------------------
head_io:
  baudrate: 115200
  sensor_rate_hz: 10          # ESP32 → PC の S 行の周期
  link_timeout_s: 1.0         # これだけ S 行が来なければ「頭部I/O断」表示（動作は継続）
  reconnect_interval_s: 1.0   # ポートが消えたときの再接続間隔
  read_timeout_s: 0.05        # シリアル読み出しのタイムアウト
  tof_max_mm: 4000
  seq_modulo: 65536
  eye_modes: {"off": 0, "on": 1, "breath": 2, "blink": 3}   # YAML では on/off を引用符で囲む（真偽値になるため）
  esp32_failsafe_s: 3.0       # ESP32 側: これだけコマンドが来なければ目を呼吸に戻す（モックで模擬）
  mock:
    fw_version: "mock-0.1"
    tof_idle_mm: 1500         # 何も無いときの ToF 距離

# ---------------------------------------------------------------------------
# 駆動リンク（PC ⇄ ESP32-S3）。仕様は docs/link_protocol.md
# 機体側（ファーム）の watchdog と絶対上限。**PC 側の設定でこれを緩められない**
# 時間の既定値は暫定。Phase 2 完了条件 13/14 の実測で確定する（要実測）
# ---------------------------------------------------------------------------
link:
  heartbeat_hz: 10.0            # PC → 機体。100ms 周期
  heartbeat_timeout_ms: 400     # 取りこぼし3回まで許す。要実測
  drive_ttl_ms: 300             # DRIVE の既定 TTL（PC が付ける）。要実測
  drive_ttl_max_ms: 1000        # 機体が受け付ける TTL の上限（長い TTL を拒否する）
  drive_disarm_ms: 2000         # DRIVE 途絶がこれを超えたら ARMED → DISARMED
  telemetry_hz: 10.0
  control_hz: 100.0             # 機体の制御周期（歩容生成・補間）
  stop_ramp_s: 0.0              # 停止時の振幅の落とし方。0 = 即時（安全側）
  clear_nonce_history: 16       # CLEAR_FAULT の nonce 再利用を弾くために覚える個数
  # 機体が受け付ける指令値の絶対上限（これを外れたら NACK。状態も出力も変えない）
  limits:
    amplitude_deg: 40.0         # 胴体ヨーのソフトリミット 85° より十分内側
    spatial_freq_deg: 150.0     # Ω。隣接関節の位相差
    temporal_freq_hz: 1.0       # |ω/2π|。負は後退
    gamma_deg: 30.0             # 旋回オフセット γ0
    head_speed_dps: 120.0       # HEAD 指令の速度上限（J7 の max_speed_dps と同じ）
    body_speed_dps: 240.0       # BODY 指令（とぐろ・鎌首）の速度上限（胴体ヨーの max_speed_dps）
  # 機体が自分で緊急停止する条件（サーボの読み値。実機未検証）
  faults:
    temp_limit_c: 60            # behavior.safety.overheat_c(55) より上。機体側の最後の砦
    current_limit_ma: 0         # 0 = 無効（電流の実測値が無いため既定では使わない）
