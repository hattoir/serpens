# Floor Watch FW03 の現行 CAD（5 サーボ）を物理シミュレーションに載せるための overlay。
# robot.yaml への上書き（`load_config(overlay=...)`）。**Engineering study 用。実機は存在しない。**
#
# 幾何の出典: CAD.md（2026-09-27、Fusion `Serpens_FW03_CLEARANCE_STUDY_NOT_FOR_PRINT` の記録値）。
#   CAD は頭方向が −X。ここは尾端原点・頭方向 +x なので x_tail = 335 − X_cad（外装 X −238〜335）。
#   J5 yaw X190 → 145 / J4 X95 → 240 / J3 X0 → 335 / J2 X−95 → 430 / J1 pitch X−181.8 → 516.8 / 頭先端 X−238 → 573
#   **記録値を写しただけで、この run で Fusion 実体を再照合していない**（CAD_VERIFIED ではない = REFERENCE_ONLY）。
# 関節名は CAD に合わせる（J1 = 首 pitch、J2〜J5 = yaw）。リストは尾→頭の順。
# 可動域: yaw は R03 の 3 段（64.8/64.9 は R03 局所形状の記録。FW03 外装・配線込みではない）。
#   J1 pitch は CAD の検討範囲 0〜+45°（干渉が残る。合格範囲ではない）→ ソフト 0〜40° は ASSUMPTION。
# 質量: **すべて ASSUMPTION**（計量値ゼロ）。サーボ 55g は config の REFERENCE 値。
body:
  length_mm: 573
  diameter_mm: 92               # 胴外装の幅 92（CAD.md）。接触用の近似カプセル径
  mass_g: 900
  tail_x_mm: 0
  head_tip_x_mm: 573
joints:
  - {name: J5, servo_id: 5, axis: yaw,   x_mm: 145.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J4, servo_id: 4, axis: yaw,   x_mm: 240.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J3, servo_id: 3, axis: yaw,   x_mm: 335.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J2, servo_id: 2, axis: yaw,   x_mm: 430.0, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J1, servo_id: 1, axis: pitch, x_mm: 516.8, direction: 1, horn_offset_deg: 0.0, onset_deg: null, onset_collides_deg: null, mechanical_min_deg: 0.0, mechanical_max_deg: 45.0, min_deg: 0.0, max_deg: 40.0, max_speed_dps: 120.0}
mass_budget_g:
  servo_each: 55                # REFERENCE（STS3215 の資料値。計量していない）
  servo_count: 5
  segment_frame_each: 45        # ASSUMPTION（PETG フレーム＋腹面シェル。FW03 は旧 EX-1 より太い）
  segment_frame_count: 6
  passive_wheels_total: 0       # 車輪なし SNAKE belly
  head_total: 90                # ASSUMPTION（XIAO Sense・ToF×2・LED・頭シェル）
  skin_and_wiring: 100          # ASSUMPTION
  tail_payload: 130             # ASSUMPTION（2S 1000mAh 電池・DC-DC・XT30・停止ボタン。電池未選定）
  neck_lifted_mass: 90
  neck_lifted_cog_mm: 35        # ASSUMPTION（J1 から頭重心まで。頭長 56mm の中ほど）
poses:
  home: {J1: 0, J2: 0, J3: 0, J4: 0, J5: 0}
gait:
  presets:
    # 胴体ヨー 4 本で 1 波 = Ω 90°
    forward:    {amplitude_deg: 30.0, spatial_freq_deg: 90.0, temporal_freq_hz: 0.5, turn_bias_deg: 0.0}
    turn_left:  {amplitude_deg: 30.0, spatial_freq_deg: 90.0, temporal_freq_hz: 0.5, turn_bias_deg: 20.0}
sim:
  # 近似カプセル（径 92mm、節 95mm）が中立でも重なるため自己接触を切る（MuJoCo のモデル化の都合。実外装の干渉判定は CAD で行う）
  mujoco_self_collision: false
