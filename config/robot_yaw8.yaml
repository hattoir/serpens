# 胴体ヨー 8 軸案 — B: 同等リンク長 95mm（全長が伸びる）
# robot.yaml への上書き（`load_config(overlay=...)`）。**設計の事前検証用。実機は存在しない。**
# 関節名: 胴体ヨー J1〜J8、首ピッチ J9、頭ヨー J10、頭ロール J11。
# リンク 95.0mm、全長 1040mm、サーボ 11 個。質量・可動域は 9 軸案と同じ仮定値
