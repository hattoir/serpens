# 胴体ヨー 8 軸案（robot.yaml への**上書き**。`serpens.config.load_config(overlay="config/robot_yaw8.yaml")`）。
#
# 背景（既知の構造的制約 1）: 6 軸 × Ω=60° = 体に 1 波しか乗らない。生体の lateral undulation は体上に約 2 波
# （Hu & Shelley 2012: κ = ε·cos(kπ(s+t))、k=2.0、周期 2 秒 ≒ 0.5Hz）。6 軸で 2 波（Ω=120°）にすると
# 1 波あたり 3 関節でジグザグに見える（最低 4〜5 関節/波が要る）。8〜10 軸への増軸をハード側へ要求済み。
# **これは設計の事前検証用。実機は存在しない。** 前進量と可視波数は tools/motion_quality.py --overlay で出す。
#
# 関節名: 胴体ヨー J1〜J8、首ピッチ J9、頭ヨー J10、頭ロール J11（胴体は「最初の pitch 軸より尾側の yaw」）。
# 節の間隔 95mm はそのまま。全長は 850 → 1040mm（2 節ぶん）。質量・可動域は 9 軸案と同じ仮定値。
body:
  length_mm: 1040
  diameter_mm: 50
  mass_g: 1200                  # 9 軸案 1000g + 2 節 × 100g（仮定）
  tail_x_mm: 0
  head_tip_x_mm: 1040
joints:
  - {name: J1,  servo_id: 1,  axis: yaw,   x_mm: 100, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J2,  servo_id: 2,  axis: yaw,   x_mm: 195, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J3,  servo_id: 3,  axis: yaw,   x_mm: 290, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J4,  servo_id: 4,  axis: yaw,   x_mm: 385, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J5,  servo_id: 5,  axis: yaw,   x_mm: 480, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J6,  servo_id: 6,  axis: yaw,   x_mm: 575, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J7,  servo_id: 7,  axis: yaw,   x_mm: 670, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J8,  servo_id: 8,  axis: yaw,   x_mm: 765, direction: 1, horn_offset_deg: 0.0, onset_deg: 64.8, onset_collides_deg: 64.9, mechanical_min_deg: -55.0, mechanical_max_deg: 55.0, min_deg: -50.0, max_deg: 50.0, max_speed_dps: 240.0}
  - {name: J9,  servo_id: 9,  axis: pitch, x_mm: 860, direction: 1, horn_offset_deg: 0.0, onset_deg: null, onset_collides_deg: null, mechanical_min_deg: -10.0, mechanical_max_deg: 95.0, min_deg: -8.0,  max_deg: 90.0, max_speed_dps: 120.0}
  - {name: J10, servo_id: 10, axis: yaw,   x_mm: 915, direction: 1, horn_offset_deg: 0.0, onset_deg: null, onset_collides_deg: null, mechanical_min_deg: -85.0, mechanical_max_deg: 85.0, min_deg: -80.0, max_deg: 80.0, max_speed_dps: 90.0}
  - {name: J11, servo_id: 11, axis: roll,  x_mm: 955, direction: 1, horn_offset_deg: 0.0, onset_deg: null, onset_collides_deg: null, mechanical_min_deg: -40.0, mechanical_max_deg: 40.0, min_deg: -35.0, max_deg: 35.0, max_speed_dps: 90.0}
markers:
  tail_x_mm: 50.0
  neck_x_mm: 830.0              # J9（首ピッチ）の 30mm 手前
mass_budget_g:
  servo_count: 11
  segment_frame_count: 10
poses:
  home: {J1: 0, J2: 0, J3: 0, J4: 0, J5: 0, J6: 0, J7: 0, J8: 0, J9: 8, J10: 0, J11: 0}
gait:
  presets:
    # 体に 2 波（Ω = 360°×2 / 8 = 90°）。1 波あたり 4 関節
    forward:    {amplitude_deg: 30.0, spatial_freq_deg: 90.0, temporal_freq_hz: 0.5, turn_bias_deg: 0.0}
    # 比較用: 9 軸案と同じ 1 波（Ω = 360° / 8 = 45°）
    one_wave:   {amplitude_deg: 30.0, spatial_freq_deg: 45.0, temporal_freq_hz: 0.5, turn_bias_deg: 0.0}
breath:
  amplitude_by_axis: {J1: 1.5, J2: 1.5, J3: 2.0, J4: 2.0, J5: 2.0, J6: 2.0, J7: 1.5, J8: 1.5, J9: 5.0, J10: 0.5, J11: 0.5}
